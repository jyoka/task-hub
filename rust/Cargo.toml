[package]
name = "task-rs"
version = "0.2.0"
edition = "2021"
publish = false

[dependencies]
ratatui = "0.30.2"
unicode-width = "0.2" # columns of wide (Japanese) text, for the reader's own wrapping
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
