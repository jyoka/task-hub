[package]
name = "task-rs"
version = "0.2.0"
edition = "2021"
publish = false

[dependencies]
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] } # Paragraph::line_count: rows of wrapped text
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
