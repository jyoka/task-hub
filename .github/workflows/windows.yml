# task-hub on Windows (docs/windows.md): the runs, and windows/install.ps1 with the scheduled watch
name: windows
on:
  push:  # every branch: a PR's branch is pushed here too
  workflow_dispatch:
    inputs:
      live:
        description: "Also run one card on the real test board (docs/release.md: secret TASK_HUB_LIVE_TOKEN, variables TASK_HUB_LIVE_*)"
        type: boolean
        default: false
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # install.ps1 clones this checkout
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # docs only (tests/ci/scope.py, as in macos.yml): nothing here reads the docs, so this job only says so and
      # passes, under its own name. Compared with the default branch: this workflow runs on the push of a PR's branch
      - name: What the change touches
        id: scope
        shell: bash
        env:
          CI_DIFF_BASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref_name != github.event.repository.default_branch && format('origin/{0}', github.event.repository.default_branch) || '' }}
        run: python tests/ci/scope.py "$CI_DIFF_BASE"
      - if: steps.scope.outputs.docs_only != 'true'
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
      # one by one, not side by side as on macOS: run side by side (tests/run.py -j 4), a test failed here that
      # passes one by one, and which one is not known yet (CONTRIBUTING.md, テスト)
      - if: steps.scope.outputs.docs_only != 'true'
        run: python -m unittest tests.test_windows -v
        env:
          TASK_TEST_WINDOWS_INSTALL: "1"
      - if: steps.scope.outputs.docs_only != 'true'
        run: python -m unittest tests.test_run -v  # tests/run.py: its lock and its low priority on Windows
      - if: steps.scope.outputs.docs_only != 'true'
        run: python -m unittest tests.test_install.SteeringTest -v  # 「セットアップして」 runs the Windows scripts too
      # the Kiro board extension on Windows: `task list` through task.cmd, and the .vsix built with tar.exe
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version: "24"
      - name: board extension
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: kiro/board-extension
        shell: pwsh
        run: |
          node --disable-warning=ExperimentalWarning --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --import ./test/resolve.mjs --test --test-name-pattern="^Windows" test/extension.test.ts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run package
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -c "import glob, zipfile; n = zipfile.ZipFile(glob.glob('task-hub-board-*.vsix')[0]).namelist(); print(n); assert {'[Content_Types].xml', 'extension.vsixmanifest', 'extension/package.json', 'extension/out/extension.js'} <= set(n) and not any(x.startswith(('./', '/')) or '\\' in x for x in n)"

  # The runner is an administrator: the same installer tests again as a standard user made for it, so that anything
  # needing admin rights (a UAC prompt on a person's PC) fails here (docs/architecture/designs/windows-easy-setup.md)
  standard-user:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: What the change touches  # as in the job test
        id: scope
        shell: bash
        env:
          CI_DIFF_BASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref_name != github.event.repository.default_branch && format('origin/{0}', github.event.repository.default_branch) || '' }}
        run: python tests/ci/scope.py "$CI_DIFF_BASE"
      - name: the installer, the diagnosis and the uninstaller, as a standard user
        if: steps.scope.outputs.docs_only != 'true'
        run: powershell -ExecutionPolicy Bypass -File tests\ci\as-standard-user.ps1 -Command "python -m unittest tests.test_windows.SetupTest tests.test_windows.InstallBoardTest -v"
      - name: a task at the user's own logon (task watch, Slack triage's key), as a standard user
        if: steps.scope.outputs.docs_only != 'true'
        run: powershell -ExecutionPolicy Bypass -File tests\ci\as-standard-user.ps1 -Minutes 3 -Command "powershell -NoProfile -ExecutionPolicy Bypass -File tests\ci\register-own-task.ps1"

  # Before a release, by hand (Actions → windows → Run workflow, with "live"): one card on a real test board to a PR
  live:
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tests/live_board.py
        env:
          TASK_HUB_LIVE_TOKEN: ${{ secrets.TASK_HUB_LIVE_TOKEN }}
          TASK_HUB_LIVE_PROJECT: ${{ vars.TASK_HUB_LIVE_PROJECT }}
          TASK_HUB_LIVE_ISSUES: ${{ vars.TASK_HUB_LIVE_ISSUES }}
          TASK_HUB_LIVE_REPO: ${{ vars.TASK_HUB_LIVE_REPO }}
