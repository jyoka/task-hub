# The landing page (site/README.md) on GitHub Pages: https://jyoka.github.io/task-hub/
# The repository's Pages source is "GitHub Actions"; the github-pages environment takes main only.
name: pages
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/**"  # site/assets is a link to it
      - "docs/brand.md"  # the words and the order of the cards and layers on the page
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
# one deployment at a time, and a running one is not cut off halfway
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # pinned to a commit: the next job can write to Pages
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      # links, nothing from outside, and the words of docs/brand.md, before anything goes out
      - name: Check the page
        run: python3 tests/test_site.py
      # one folder with the files behind site/assets copied in (site/README.md)
      - name: Build _site
        run: rm -rf _site && cp -RL site _site && rm _site/README.md
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
